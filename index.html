<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control General de Materiales FBB Dept.</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#e9edf3; --surface:#ffffff; --surface-2:#f3f6fa; --line:rgba(16,34,64,.10); --line-2:rgba(16,34,64,.20);
  --ink:#0f1b2d; --ink-2:#46546a; --ink-3:#7c889b;
  --nav-bg:#0e1f3a; --nav-bg-2:#16294a; --nav-ink:#c9d4e5; --nav-ink-2:#8193ad; --head:#0e1f3a;
  --accent:#2a78d6; --accent-ink:#fff; --accent-soft:#e3eefb;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-soft:#e2f4e2; --warn-soft:#fdf1d6; --serious-soft:#fbe6dd; --crit-soft:#f8e0e0; --mute-soft:#ecebe7;
  --s100:#cde2fb; --s200:#9ec5f4; --s300:#6da7ec; --s400:#3987e5; --s500:#256abf; --s600:#184f95; --s700:#0d366b;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
  --card-shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0b1220; --surface:#131c2e; --surface-2:#1a2539; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.18);
    --ink:#eef2f8; --ink-2:#b7c2d3; --ink-3:#7f8ca1;
    --nav-bg:#08101d; --nav-bg-2:#121d31; --head:#eef2f8; --card-shadow:none;
    --accent:#3987e5; --accent-soft:#1d2d42;
    --good-soft:#18301a; --warn-soft:#3a2f12; --serious-soft:#3a2418; --crit-soft:#3a1c1c; --mute-soft:#2a2a28;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.5px;margin-bottom:10px}
.brand h1{font-size:15px;margin:0;line-height:1.25}
.brand p{margin:4px 0 0;color:var(--ink-3);font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--ink)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
nav svg{width:18px;height:18px;flex:none}
nav .badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px;display:flex;flex-direction:column;gap:8px}
body.ro .edit-only{display:none!important}
body:not(.ro) .ro-only{display:none!important}
#authBox .btn{width:100%;justify-content:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3);margin-right:6px;vertical-align:middle}
main{padding:24px 28px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h2{margin:0;font-size:22px;letter-spacing:-.2px}
.top .sub{color:var(--ink-2);margin-top:2px}
.cutpill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 8px 6px 14px;font-size:13px}
.cutpill select{border:0;background:var(--surface-2);border-radius:99px;padding:4px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h3{margin:0 0 2px;font-size:15px}
.card .hint{color:var(--ink-3);font-size:12.5px;margin:0 0 12px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.kpi .lbl{color:var(--ink-2);font-size:12.5px;font-weight:550}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-top:4px}
.kpi .foot{font-size:12px;color:var(--ink-3);margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
input:not([type]),input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;min-height:34px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:550;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 8px;min-height:26px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:550}
.seg button.on{background:var(--accent);color:#fff}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);font-size:12px;color:var(--ink-2);font-weight:650;z-index:1;cursor:default}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
td.num,th.num{text-align:right}
td.wrap{white-space:normal;min-width:260px;max-width:420px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.mname{font-weight:600}
.mspec{color:var(--ink-3);font-size:12px;margin-top:1px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--ink-2)}
.z{color:var(--ink-3)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.tag svg{width:12px;height:12px}
.t-good{background:var(--good-soft);color:var(--ink)} .t-good svg{color:var(--good)}
.t-warn{background:var(--warn-soft);color:var(--ink)} .t-warn svg{color:#b97f00}
.t-serious{background:var(--serious-soft);color:var(--ink)} .t-serious svg{color:var(--serious)}
.t-crit{background:var(--crit-soft);color:var(--ink)} .t-crit svg{color:var(--crit)}
.t-mute{background:var(--mute-soft);color:var(--ink-2)}
.t-info{background:var(--accent-soft);color:var(--ink)} .t-info svg{color:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:18px;height:18px;flex:none;margin-top:1px}
.banner.warn{background:var(--warn-soft)} .banner.crit{background:var(--crit-soft)} .banner.info{background:var(--accent-soft)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .when{width:58px;flex:none;text-align:center;border-radius:8px;background:var(--surface-2);padding:4px 0;line-height:1.1}
.li .when b{display:block;font-size:17px}
.li .when span{font-size:11px;color:var(--ink-2);text-transform:uppercase}
.li .body{flex:1;min-width:0}
.li .body .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .body .s{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.click{cursor:pointer} .li.click:hover{background:var(--surface-2)}
/* charts */
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:170px 1fr 104px;align-items:center;gap:10px;font-size:13px;padding:2px 0;border-radius:6px}
.bar-row:hover{background:var(--surface-2)}
.bar-row .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar-row .bl b{color:var(--ink);font-weight:600}
.bar-track{height:14px;position:relative}
.bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--s400);border-radius:0 4px 4px 0}
.bar-row .bv{text-align:right;font-weight:600;white-space:nowrap}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12.5px;z-index:100;max-width:300px;box-shadow:var(--shadow);display:none}
.tip .tt{font-weight:700;margin-bottom:2px}
/* heatmap */
.heat td.hc{text-align:right;min-width:74px;font-size:12.5px}
.legend-scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.legend-scale .ramp{display:flex;height:10px;width:180px;border-radius:3px;overflow:hidden}
.legend-scale .ramp i{flex:1}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cal .dh{background:var(--surface-2);padding:8px;font-size:12px;font-weight:650;color:var(--ink-2);text-align:center}
.cal .day{background:var(--surface);min-height:112px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal .day:hover{background:var(--surface-2)}
.cal .day.out{background:var(--bg)} .cal .day.out .dn{color:var(--ink-3)}
.cal .dn{font-size:12.5px;font-weight:650;color:var(--ink-2);display:flex;justify-content:space-between}
.cal .day.today .dn span{background:var(--accent);color:#fff;border-radius:99px;padding:0 7px}
.chip{font-size:11.5px;border-radius:5px;padding:2px 6px;background:var(--surface-2);border-left:3px solid var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.chip:hover{filter:brightness(.95)}
.chip.st-programado{border-left-color:var(--accent);background:var(--accent-soft)}
.chip.st-transito{border-left-color:var(--warn);background:var(--warn-soft)}
.chip.st-entregado{border-left-color:var(--good);background:var(--good-soft)}
.chip.st-cancelado{border-left-color:var(--ink-3);background:var(--mute-soft);text-decoration:line-through;color:var(--ink-3)}
.chip.overdue{border-left-color:var(--crit);background:var(--crit-soft)}
.more{font-size:11.5px;color:var(--ink-2);padding-left:4px}
.cal-wrap>*{min-width:0}
.cal-wrap .grid{grid-template-columns:minmax(0,1fr)}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.scrim.on{display:flex}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(760px,100%);padding:20px 22px}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .mh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.form .full{grid-column:1/-1}
.items-tbl td{padding:4px 4px;border:0}
.items-tbl input{width:100%}
.mfoot{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.warnline{font-size:12px;color:var(--crit);margin-top:2px}
/* upload */
.drop{display:block;border:2px dashed var(--line-2);border-radius:12px;padding:34px;text-align:center;cursor:pointer;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:12.5px}
.delta-up{color:var(--good);font-weight:600} .delta-dn{color:var(--crit);font-weight:600}
.svgchart text{fill:var(--ink-3);font-size:11px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:200;display:none;font-weight:550}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.mt{margin-top:14px}
.whname{font-size:11px;color:var(--ink-3);font-weight:500;display:block}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
  nav{flex-direction:row;flex-wrap:wrap}
  .side-foot{margin-top:0;flex-direction:row;align-items:center}
  main{padding:16px}
  .cal-wrap{grid-template-columns:1fr}
  .cal .day{min-height:70px}
  .form{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
}

.navg{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;padding:12px 10px 4px}
nav a span:first-of-type{flex:1;min-width:0}
a.card.link{text-decoration:none;color:inherit;display:block}
a.card.link:hover{border-color:var(--accent)}
tr.grp td{background:var(--surface-2);font-weight:700;font-size:12.5px;color:var(--ink)}
tr.zero td{color:var(--ink-3)} tr.zero .mname{color:var(--ink-2)}
.brk{font-size:11px;color:var(--crit);font-weight:600}
.mini{display:flex;align-items:center;gap:8px}.mini .bar-track{flex:1;height:10px}.mini span{min-width:22px;text-align:right;font-weight:600}
.errbox{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;margin-top:6px}

/* ---- Tema corporativo ---- */
aside{background:linear-gradient(180deg,var(--nav-bg) 0%,#0b1830 100%);border-right:0;color:var(--nav-ink)}
.brand h1{color:#fff}
.brand p{color:var(--nav-ink-2)}
.brand .logo{background:linear-gradient(135deg,#3b8cf0,#1d5fc4);box-shadow:0 4px 12px rgba(29,95,196,.45)}
nav a{color:var(--nav-ink)}
nav a:hover{background:var(--nav-bg-2);color:#fff}
nav a.on{background:rgba(59,140,240,.18);color:#fff;box-shadow:inset 3px 0 0 #3b8cf0}
.navg{color:var(--nav-ink-2)}
.side-foot{color:var(--nav-ink-2)}
.side-foot b{color:#fff!important}
#authBox .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:#fff}
#authBox .btn:hover{background:rgba(255,255,255,.12)}
main{background:linear-gradient(180deg,#dfe6f0 0,var(--bg) 220px)}
.top h2{color:var(--head);font-size:24px;letter-spacing:-.3px}
.card{box-shadow:var(--card-shadow);border-color:var(--line)}
.kpi{border-top:3px solid #3b8cf0}
.kpi .val{color:var(--head)}
th{background:#eef2f8;color:#3a4a63;text-transform:uppercase;font-size:11px;letter-spacing:.3px}
tr.grp td{background:#e4ebf5;color:#16335f}
.tbl-wrap{box-shadow:var(--card-shadow)}
.cutpill{box-shadow:var(--card-shadow)}
input.cellin{width:86px;min-height:28px;padding:3px 6px;text-align:right;background:#fffbea;border-color:#e6cf7a}
td.tot,th.tot{background:#f1f6fe}
@media (prefers-color-scheme:dark){
  main{background:var(--bg)}
  th{background:var(--surface-2);color:var(--ink-2)}
  tr.grp td{background:#1d2b45;color:#cfe0ff}
  input.cellin{background:#2a2614;border-color:#6b5a1e}
  td.tot,th.tot{background:#17233a}
}
table.kv th{position:static;background:none;text-transform:none;font-size:12.5px;letter-spacing:0;color:var(--ink-3);width:170px;border-bottom:1px solid var(--line)}
table.kv td{white-space:normal}
</style>
</head>
<body class="ro">
<div class="app">
  <aside>
    <div class="brand">
      <div class="logo">FBB</div>
      <h1>Control General de Materiales FBB Dept.</h1>
      <p>Fixed &amp; Broadband Services Center</p>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot"><div id="authBox"></div><div id="syncState"><span class="dot"></span>Conectando…</div></div>
  </aside>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script>

function staleBanner(c, kind='wh'){

  if(c!==latest) return `<div class="banner info">${ICON.clock}<div>Estás viendo el corte del <b>${fmtDate(c.date)}</b>, no el más reciente (${fmtDate(latest.date)}).</div></div>`;

/* ============ Gráficos ============ */
function hbars(rows){
  const max = Math.max(1, ...rows.map(r=>r.value));
  return `<div class="bars">${rows.map(r=>`<div class="bar-row" data-tip="${esc(r.tip||'')}" ${r.act?`style="cursor:pointer" data-act="${r.act}"`:''}>
    <div class="bl"><b>${esc(r.label)}</b>${r.sub?` <span class="muted">${esc(r.sub)}</span>`:''}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${(r.value/max*100).toFixed(2)}%;${r.value>0?'min-width:2px':''}"></div></div>
    <div class="bv">${r.text ?? fmt(r.value)}</div></div>`).join('')}</div>`;
}
function lineChart(points){
  if(points.length<2) return `<div class="empty" style="padding:24px">Se necesitan al menos dos cortes para ver la tendencia.</div>`;
  const W=640,H=220,L=56,R=16,T=14,B=28;
  const ys = points.map(p=>p.y); let lo=Math.min(0,...ys), hi=Math.max(...ys); if(hi===lo) hi=lo+1;
  const nice = v => { const p=Math.pow(10,Math.floor(Math.log10(Math.max(1,v)))); return Math.ceil(v/p)*p; }; hi = nice(hi);
  const X = i => L + i*(W-L-R)/(points.length-1);
  const Y = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);
  const ticks = [0,.25,.5,.75,1].map(f=>lo+f*(hi-lo));
  const path = points.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const step = Math.max(1, Math.ceil(points.length/8));
  return `<svg class="svgchart" viewBox="0 0 ${W} ${H}" width="100%" style="max-height:260px">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end">${fmt(Math.round(t))}</text>`).join('')}
    ${points.map((p,i)=> i%step===0||i===points.length-1 ? `<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(p.x)}</text>`:'').join('')}
    <path d="${path}" fill="none" stroke="var(--s400)" stroke-width="2" stroke-linejoin="round"/>
    ${points.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" fill="var(--s400)" stroke="var(--surface)" stroke-width="2"/>
      <rect x="${X(i)-14}" y="${T}" width="28" height="${H-T-B}" fill="transparent" data-tip="${esc(p.tip||'')}"/>`).join('')}
  </svg>`;
}
const RAMP = ['var(--s100)','var(--s200)','var(--s300)','var(--s400)','var(--s500)','var(--s600)','var(--s700)'];
function rampColor(f){ if(!(f>0)) return ''; const i = Math.min(RAMP.length-1, Math.floor(f*RAMP.length)); return `background:${RAMP[i]};color:${i>=3?'#fff':'var(--ink)'}`; }
const numCell = (v, b, showB) => `<td class="num">${v?fmt(v):'<span class="z">0</span>'}${showB&&b?`<div class="brk">+${fmt(b)} dañ.</div>`:''}</td>`;

/* ============ Resumen ============ */
function secStats(c, T){
  const cat = catGpon().filter(i=>i.code);
  let withStock=0, none=0, low=0, broken=0;
  for(const it of cat){ const s = sumType(c, it.code, T); if(s.g>0) withStock++; else none++; const st = stStatus(s.g, minOf(T,it.code)); if(s.g>0 && (st.k==='crit'||st.k==='warn')) low++; if(s.b>0) broken++; }
  return {n:cat.length, withStock, none, low, broken, whs:whsIn(c,T).length};
}

  const maxCov = Math.max(1, ...Object.values(cov).map(s=>s.size));

  const alerts = [];

  }
  const lm = curLm();
  $('#main').innerHTML = header('Resumen', `Corte del ${fmtDate(c.date)} · ${whsIn(c).length} almacenes · ${catGpon().length} materiales en la lista ODN`) + staleBanner(c) + `
  <div class="grid g4">
    <div class="card kpi"><div class="lbl">Último reporte del WMS</div><div class="val">${fmtDate(c.date)}</div><div class="foot">${age<=0?'Hoy':age===1?'Hace 1 día':`Hace ${age} días`}</div></div>
    ${stats.map(s=>`<a class="card kpi link" href="#${SECS[s.T].hash}"><div class="lbl">${SECS[s.T].n}. ${SECS[s.T].title}</div><div class="val">${s.withStock}<span class="muted" style="font-size:16px"> / ${s.n}</span></div>
      <div class="foot">con stock · <span style="color:${s.none?'var(--crit)':'inherit'}">${s.none} sin stock</span>${s.low?` · ${s.low} bajo mín.`:''}</div></a>`).join('')}
  </div>
  <div class="grid g2 mt">
    <div class="card"><h3>Cobertura por región</h3><p class="hint">Materiales de la lista con stock en cada región y tipo de almacén (de ${catCodes.size}).</p>
      <div class="tbl-wrap" style="max-height:none"><table><thead><tr><th>Región</th>${SEC_KEYS.map(T=>`<th>${SECS[T].short}</th>`).join('')}</tr></thead><tbody>
      ${regions.map(r=>`<tr><td><b>${esc(r)}</b> <span class="muted">${esc(regionLabel(r))}</span></td>${SEC_KEYS.map(T=>{const n=(cov[r+'|'+T]||new Set()).size; const w=`${r}_${T==='GPON'?'GPON':T==='NOC'?'NOC_GPON':'ROTATIONAL_GPON'}`;
        return `<td style="min-width:120px" data-tip="<div class='tt'>${esc(w)}</div>${n} de ${catCodes.size} materiales con stock"><div class="mini"><div class="bar-track"><div class="bar-fill" style="width:${n/maxCov*100}%;${n?'min-width:2px':''}"></div></div><span>${n||'<span class=z>—</span>'}</span></div></td>`}).join('')}</tr>`).join('')}
      </tbody></table></div></div>
    <div class="card"><h3>Próximas entregas</h3><p class="hint">Programadas o en tránsito.</p>

      ${od.length?`<div class="banner crit mt" style="margin-bottom:0">${ICON.crit}<div><b>${od.length} entrega${od.length>1?'s':''} vencida${od.length>1?'s':''}</b> sin marcar como entregada. <a href="#calendario">Revisar</a></div></div>`:''}
      <div class="kpi mt" style="border-top:1px solid var(--line);padding-top:12px"><div class="lbl">4. Lastmile (BCCS1)</div><div class="foot">${lm?`Último reporte: ${fmtDate(lm.date)}`:'Fuente de datos pendiente de definir.'} <a href="#lastmile">Ver sección</a></div></div>

        : `<div class="empty" style="padding:20px">Sin alertas. Para recibirlas, abre un material en cualquier sección y define su stock mínimo.</div>`}</div>

function delivLi(d){
  const dt = parseISO(d.date);

  const title = items[0] ? info(items[0].code).name + (items.length>1?` +${items.length-1}`:'') : (TYPES[d.type]||'Entrega');

}

/* ============ Tabla de stock (secciones 1–4) ============ */
function stockTable({c, cat, whs, T, kindLabel}){
  const f = S.tbl, q = f.q.trim().toLowerCase();
  const codesCat = new Set(cat.map(i=>i.code).filter(Boolean));
  let rows = cat.map((it,i)=>{
    const per = whs.map(w=>{ const v = idx(c).get(it.code)?.get(w); return {g:v?.g||0, b:v?.b||0}; });
    const total = per.reduce((a,x)=>a+x.g,0), broken = per.reduce((a,x)=>a+x.b,0);
    return {it, i, per, total, broken, st: it.code ? stStatus(total, minOf(T,it.code)) : {k:'nc',l:'Sin código',cls:'t-mute'}};
  });
  // Materiales presentes en los almacenes que no están en la lista
  const others = c ? [...idx(c).keys()].filter(code=>!codesCat.has(code) && whs.some(w=>qty(c,code,w)>0 || (idx(c).get(code)?.get(w)?.b||0)>0)).map(code=>{
    const per = whs.map(w=>{ const v = idx(c).get(code)?.get(w); return {g:v?.g||0, b:v?.b||0}; });
    const inf = info(code);
    return {it:{code, name:inf.name, unit:inf.unit, grp:'', sub:'', type:''}, per, total:per.reduce((a,x)=>a+x.g,0), broken:per.reduce((a,x)=>a+x.b,0), st:stStatus(1,null), other:true};
  }) : [];
  const groups = [...new Set(cat.map(i=>i.grp).filter(Boolean))];
  const filt = r => (!q || (r.it.code+' '+r.it.name+' '+(r.it.sub||'')+' '+(r.it.type||'')).toLowerCase().includes(q))
    && (!f.grp || r.it.grp===f.grp)
    && (!f.wh || r.per[whs.indexOf(f.wh)]?.g>0)
    && (!f.st || (f.st==='sin'?r.total<=0 : f.st==='con'?r.total>0 : f.st==='alert'?['crit','warn'].includes(r.st.k)&&r.total>0 : f.st==='dan'?r.broken>0 : true));
  rows = rows.filter(filt);
  const oth = others.filter(filt);
  const sorted = f.sort!=='cat';
  if(sorted){
    const val = r => f.sort==='code'?r.it.code : f.sort==='name'?r.it.name.toLowerCase() : f.sort==='total'?r.total : f.sort==='min'?(minOf(T,r.it.code)??-1) : f.sort==='st'?r.st.k : (r.per[whs.indexOf(f.sort)]?.g||0);
    rows.sort((a,b)=>{ const x=val(a), y=val(b); return (x<y?-1:x>y?1:0)*f.dir; });
  }
  const arrow = k => f.sort===k ? (f.dir>0?' ▲':' ▼') : '';
  const cols = whs.length + 6;
  const rowHtml = r => `<tr class="click ${r.total<=0?'zero':''}" data-act="mat:${r.it.code}:${T}">
      <td class="code">${r.it.code?esc(r.it.code):'<span class="z">sin código</span>'}</td>
      <td class="wrap"><div class="mname">${esc(r.it.name)}</div>${r.it.type||r.it.sub?`<div class="mspec">${esc([r.it.sub,r.it.type].filter(Boolean).join(' · '))}</div>`:''}</td>
      <td>${esc(unitEs(r.it.unit))}</td>
      <td class="num"><b>${r.total?fmt(r.total):'<span class="z">0</span>'}</b>${f.broken&&r.broken?`<div class="brk">+${fmt(r.broken)} dañ.</div>`:''}</td>
      ${r.per.map(x=>numCell(x.g,x.b,f.broken)).join('')}
      <td class="num">${r.it.code&&minOf(T,r.it.code)!==null?fmt(minOf(T,r.it.code)):'<span class="z">—</span>'}</td>
      <td>${tag(r.st.cls,r.st.l,r.st.ic)}</td></tr>`;
  let body = '';
  if(sorted) body = rows.map(rowHtml).join('');
  else for(const g of [...groups, '']){ const rs = rows.filter(r=>(r.it.grp||'')===g); if(!rs.length) continue; if(g) body += `<tr class="grp"><td colspan="${cols}">${esc(g)} <span class="muted">· ${rs.length}</span></td></tr>`; body += rs.map(rowHtml).join(''); }
  if(!body) body = `<tr><td colspan="${cols}" class="empty">Ningún material coincide con los filtros.</td></tr>`;
  const head = `<thead><tr>
      <th class="sort" data-sort="code">Código${arrow('code')}</th><th class="sort" data-sort="name">Material${arrow('name')}</th><th>Und.</th>
      <th class="sort num" data-sort="total">Total${arrow('total')}</th>
      ${whs.map(w=>`<th class="sort num" data-sort="${w}" title="${esc(w)}">${esc(T==='LM'?w:whRegion(w))}${arrow(w)}${T==='LM'?'':`<span class="whname">${esc(regionLabel(whRegion(w)))}</span>`}</th>`).join('')}
      <th class="sort num" data-sort="min">Mínimo${arrow('min')}</th><th class="sort" data-sort="st">Estado${arrow('st')}</th></tr></thead>`;
  const html = `
  <div class="toolbar">
    <input type="search" id="sq" placeholder="Buscar código, material o tipo…" value="${esc(f.q)}" style="min-width:240px" class="grow">
    <select id="sgrp"><option value="">Todas las secciones</option>${groups.map(g=>`<option ${f.grp===g?'selected':''}>${esc(g)}</option>`).join('')}</select>
    <select id="swh"><option value="">Todos los almacenes</option>${whs.map(w=>`<option value="${w}" ${f.wh===w?'selected':''}>Con stock en ${esc(w)}</option>`).join('')}</select>
    <select id="sst"><option value="">Todos</option><option value="con" ${f.st==='con'?'selected':''}>Con stock</option><option value="sin" ${f.st==='sin'?'selected':''}>Sin stock</option><option value="alert" ${f.st==='alert'?'selected':''}>Bajo / cerca del mínimo</option><option value="dan" ${f.st==='dan'?'selected':''}>Con material dañado</option></select>
    <label class="row" style="font-size:13px"><input type="checkbox" id="sbrk" ${f.broken?'checked':''}> Ver dañados</label>
    ${sorted?'<button class="btn" id="sReset">Orden de la lista</button>':''}
    <button class="btn" id="xlsxBtn">Descargar Excel</button>
  </div>
  <div class="tbl-wrap"><table>${head}<tbody>${body}</tbody></table></div>
  ${others.length?`<details class="card mt" ${oth.length&&q?'open':''}><summary style="cursor:pointer"><b>Otros materiales en estos almacenes</b> <span class="muted">· ${others.length} que no están en tu lista de materiales</span></summary>
    <div class="tbl-wrap mt"><table>${head.replace(/class="sort[^"]*" data-sort="[^"]*"/g,'')}<tbody>${oth.map(rowHtml).join('')||`<tr><td colspan="${cols}" class="empty">Ninguno coincide con los filtros.</td></tr>`}</tbody></table></div></details>`:''}
  <p class="muted" style="font-size:12px">Clic en un material para ver el detalle por almacén, compararlo entre tipos de almacén, fijar su mínimo o programar un movimiento.</p>`;
  const bind = (rerender) => {

const DEFAULT_RATE = {BCCS_LI1:21,BCCS_LI2:6,BCCS_LI3:5,BCCS_LI4:19,BCCS_LAL:12,BCCS_CUS:18,BCCS_ARE:11,BCCS_PIU:6,BCCS_CAJ:5,BCCS_HUN:5,BCCS_JUN:8,BCCS_LI7:1,BCCS_SAN:2};

const ALERT_DAYS = 10;

const lmRate = b => Number(S.lm.rate?.[b] ?? DEFAULT_RATE[b] ?? 0);

const lmCentral = (c, code) => { let s=0; const m = idx(c).get(code); if(m) for(const v of m.values()) s += v.g; return s; };
function coverage(getQty){ // clientes que alcanzan con el stock y material que limita
  const kit = lmKit(); let clients = Infinity, limit = null;
  for(const [code, per] of Object.entries(kit)){ if(!(per>0)) continue; const n = Math.floor(getQty(code)/per); if(n < clients){ clients = n; limit = code; } }

}
function branchCov(b){

  if(!hasData) return {b, ...cv, rate, days:null, st:{k:'nodata',l:'Sin datos',cls:'t-mute'}};
  const days = rate>0 ? cv.clients / rate : null;
  const st = days===null ? {k:'none',l:'Sin consumo',cls:'t-mute'} : days<=ALERT_DAYS ? {k:'crit',l:`Quedan ${Math.floor(days)} día${Math.floor(days)===1?'':'s'}`,cls:'t-crit',ic:'crit'} : {k:'ok',l:'OK',cls:'t-good',ic:'ok'};

}

const whOf = (r, T) => `${r}_${T==='GPON'?'GPON':T==='NOC'?'NOC_GPON':'ROTATIONAL_GPON'}`;
function vComparativa(){
  const c = curWh();
  if(!c){ $('#main').innerHTML = header('Comparativa de almacenes','') + emptyState(); return; }
  const cat = catGpon().filter(i=>i.code);
  const all = whsIn(c);
  const regions = [...new Set(all.map(whRegion))].sort(regionSort);
  const k = S.cmp;
  if(!k.code || !cat.some(i=>i.code===k.code)) k.code = (cat.find(i=>idx(c).has(i.code))||cat[0]||{}).code || '';
  if(!all.includes(k.a)) k.a = all.find(w=>w==='VTP_GPON') || all[0];
  if(!all.includes(k.b)) k.b = all.find(w=>w!==k.a && whRegion(w)!=='VTP') || all[1] || all[0];
  // Matriz región × tipo para el material elegido
  const grid = regions.map(r=>({r, v:SEC_KEYS.map(T=>qty(c,k.code,whOf(r,T)))}));
  const gmax = Math.max(1, ...grid.flatMap(g=>g.v));
  const tot = SEC_KEYS.map((T,i)=>grid.reduce((a,g)=>a+g.v[i],0));
  // A vs B
  const codes = [...new Set([...cat.map(i=>i.code), ...idx(c).keys()])].filter(code=>qty(c,code,k.a)>0||qty(c,code,k.b)>0);
  const ab = codes.map(code=>({code, a:qty(c,code,k.a), b:qty(c,code,k.b)})).sort((x,y)=>Math.abs(y.a-y.b)-Math.abs(x.a-x.b));
  const onlyA = ab.filter(x=>x.a&&!x.b).length, onlyB = ab.filter(x=>x.b&&!x.a).length;
  const missingA = cat.filter(i=>!qty(c,i.code,k.a)).length, missingB = cat.filter(i=>!qty(c,i.code,k.b)).length;
  // Sugerencias
  const T = k.sugT, src = k.sugSrc;
  const centralW = whOf('VTP', T);
  const sugg = regions.filter(r=>r!=='VTP' || src==='recuperado').map(r=>{
    const dest = whOf(r,T);
    const from = src==='central' ? centralW : whOf(r,'ROT');
    const list = cat.filter(i=>!qty(c,i.code,dest) && qty(c,i.code,from)>0).map(i=>({i, av:qty(c,i.code,from)}));
    return {r, dest, from, list};
  }).filter(g=>all.includes(g.dest) || g.list.length);
  const whOpts = sel => SEC_KEYS.map(t=>`<optgroup label="${SECS[t].title}">${all.filter(w=>whType(w)===t).map(w=>`<option value="${w}" ${sel===w?'selected':''}>${w} · ${esc(regionLabel(whRegion(w)))}</option>`).join('')}</optgroup>`).join('') + (all.some(w=>whType(w)==='OTRO')?`<optgroup label="Otros">${all.filter(w=>whType(w)==='OTRO').map(w=>`<option value="${w}" ${sel===w?'selected':''}>${w}</option>`).join('')}</optgroup>`:'');
  const inf = info(k.code);
  $('#main').innerHTML = header('Comparativa de almacenes', `Proyectos, incidencias y recuperado, región por región · corte del ${fmtDate(c.date)}`) + staleBanner(c) + `
  <div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3>Un material en todos los almacenes</h3><p class="hint">Cantidad por región y tipo de almacén. El color indica dónde se concentra.</p></div>
    <select id="cCode" style="max-width:460px">${cat.map(i=>`<option value="${i.code}" ${i.code===k.code?'selected':''}>${i.code} — ${esc(i.name)}</option>`).join('')}</select></div>
    <div class="tbl-wrap heat" style="max-height:none"><table><thead><tr><th>Región</th>${SEC_KEYS.map(T=>`<th class="num">${SECS[T].n}. ${SECS[T].short}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>
    ${grid.map(g=>`<tr><td><b>${esc(g.r)}</b> <span class="muted">${esc(regionLabel(g.r))}</span></td>${g.v.map((v,i)=>`<td class="hc" style="${rampColor(v/gmax)}" data-tip="<div class='tt'>${esc(whOf(g.r,SEC_KEYS[i]))}</div>${fmt(v)} ${esc(unitEs(inf.unit))}">${v?fmt(v):''}</td>`).join('')}<td class="num"><b>${fmt(g.v.reduce((a,b)=>a+b,0))}</b></td></tr>`).join('')}
    <tr class="grp"><td>Total</td>${tot.map(v=>`<td class="num">${fmt(v)}</td>`).join('')}<td class="num">${fmt(tot.reduce((a,b)=>a+b,0))}</td></tr></tbody></table></div>
    <div class="row mt"><button class="btn sm" data-act="mat:${k.code}:GPON">Ver detalle</button><span class="muted" style="font-size:12px">${esc(unitEs(inf.unit))}</span></div>
  </div>

  <div class="card mt"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3>Almacén vs. almacén</h3><p class="hint">Cualquier par de almacenes, de cualquier tipo.</p></div>
    <div class="row"><select id="cA">${whOpts(k.a)}</select><span class="muted">vs</span><select id="cB">${whOpts(k.b)}</select></div></div>
    <div class="row" style="margin-bottom:10px">${tag('t-info',`${ab.length-onlyA-onlyB} en ambos`)} ${tag('t-mute',`${onlyA} solo en ${k.a}`)} ${tag('t-mute',`${onlyB} solo en ${k.b}`)} <span class="muted" style="font-size:12px">De tu lista faltan ${missingA} en ${esc(k.a)} y ${missingB} en ${esc(k.b)}.</span></div>
    <div class="tbl-wrap" style="max-height:420px"><table><thead><tr><th>Código</th><th>Material</th><th>Und.</th><th class="num">${esc(k.a)}</th><th class="num">${esc(k.b)}</th><th class="num">Diferencia</th></tr></thead>
    <tbody>${ab.map(x=>{const i=info(x.code);return `<tr class="click" data-act="mat:${x.code}:${whType(k.a)==='OTRO'?'GPON':whType(k.a)}"><td class="code">${x.code}</td><td class="wrap"><div class="mname">${esc(i.name)}</div>${i.inCat?'':'<div class="mspec">Fuera de la lista</div>'}</td><td>${esc(unitEs(i.unit))}</td><td class="num">${x.a?fmt(x.a):'<span class="z">0</span>'}</td><td class="num">${x.b?fmt(x.b):'<span class="z">0</span>'}</td><td class="num">${fmt(x.a-x.b)}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Ninguno de los dos almacenes tiene stock.</td></tr>'}</tbody></table></div>
  </div>

  <div class="card mt"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3>Sugerencias de reabastecimiento</h3><p class="hint">Materiales de tu lista que le faltan a un almacén y que sí hay en otro.</p></div>
    <div class="row"><select id="sT">${['GPON','NOC'].map(t=>`<option value="${t}" ${T===t?'selected':''}>Faltantes en ${SECS[t].title}</option>`).join('')}</select>
      <select id="sSrc"><option value="central" ${src==='central'?'selected':''}>Desde el central (${esc(centralW)})</option><option value="recuperado" ${src==='recuperado'?'selected':''}>Desde el recuperado de la misma región</option></select></div></div>
    ${sugg.map(g=>`<details style="border-bottom:1px solid var(--line);padding:8px 0"><summary style="cursor:pointer"><b>${esc(g.dest)}</b> <span class="muted">${esc(regionLabel(g.r))}</span> — ${g.list.length} material${g.list.length===1?'':'es'} disponible${g.list.length===1?'':'s'} en ${esc(g.from)}</summary>
      ${g.list.length?`<div class="list" style="margin-top:6px">${g.list.map(x=>`<div class="li"><div class="body"><div class="t">${esc(x.i.name)}</div><div class="s"><span class="code">${x.i.code}</span> · disponible en ${esc(g.from)}: ${fmt(x.av)} ${esc(unitEs(x.i.unit))}</div></div><button class="btn sm edit-only" data-act="xfer:${g.from}:${g.dest}:${x.i.code}">Programar transferencia</button></div>`).join('')}</div>`:'<p class="muted">Nada que sugerir.</p>'}</details>`).join('') || '<p class="muted">Sin sugerencias.</p>'}
  </div>`;
  $('#cCode').onchange=e=>{k.code=e.target.value; render();};
  $('#cA').onchange=e=>{k.a=e.target.value; render();};
  $('#cB').onchange=e=>{k.b=e.target.value; render();};
  $('#sT').onchange=e=>{k.sugT=e.target.value; render();};
  $('#sSrc').onchange=e=>{k.sugSrc=e.target.value; render();};
}

/* ============ 5. Movimientos diarios ============ */
function vMovimientos(){
  const l = cortesOf('wh');
  if(!l.length){ $('#main').innerHTML = header('Movimientos diarios','',null) + emptyState(); return; }
  const mv = S.mov, dates = l.map(x=>x.date);
  if(!dates.includes(mv.b)) mv.b = dates[dates.length-1];
  if(!dates.includes(mv.a)) mv.a = dates.length>1 ? dates[dates.length-2] : dates[0];
  const A = l.find(x=>x.date===mv.a), B = l.find(x=>x.date===mv.b);
  const catCodes = new Set(catGpon().map(i=>i.code).filter(Boolean));
  const keys = new Set([...A.rows,...B.rows].map(r=>r.w+'|'+r.c));
  let moves = [];
  for(const key of keys){ const [w,code] = key.split('|'); const a = qty(A,code,w), b = qty(B,code,w); if(a!==b) moves.push({w,code,a,b,d:b-a}); }
  const regions = [...new Set(moves.map(m=>whRegion(m.w)))].sort(regionSort);
  moves = moves.filter(m=>(!mv.t || whType(m.w)===mv.t) && (!mv.r || whRegion(m.w)===mv.r) && (!mv.onlyCat || catCodes.has(m.code)));
  moves.sort((x,y)=>whSort(x.w,y.w) || Math.abs(y.d)-Math.abs(x.d));
  const ins = moves.filter(m=>m.d>0), outs = moves.filter(m=>m.d<0);
  const byWh = {}; moves.forEach(m=>{ const o = byWh[m.w] = byWh[m.w] || {up:0, dn:0}; if(m.d>0) o.up++; else o.dn++; });
  const opts = sel => l.slice().reverse().map(x=>`<option value="${x.date}" ${x.date===sel?'selected':''}>${fmtDate(x.date)}</option>`).join('');
  $('#main').innerHTML = header('Movimientos diarios', 'Qué entró y qué salió de cada almacén entre dos reportes del WMS', null) + `
  <div class="toolbar">
    <span>Desde</span><select id="mA">${opts(mv.a)}</select><span>hasta</span><select id="mB">${opts(mv.b)}</select>
    <select id="mT"><option value="">Todos los tipos</option>${SEC_KEYS.map(t=>`<option value="${t}" ${mv.t===t?'selected':''}>${SECS[t].title}</option>`).join('')}</select>
    <select id="mR"><option value="">Todas las regiones</option>${regions.map(r=>`<option value="${r}" ${mv.r===r?'selected':''}>${r} · ${esc(regionLabel(r))}</option>`).join('')}</select>
    <label class="row" style="font-size:13px"><input type="checkbox" id="mC" ${mv.onlyCat?'checked':''}> Solo materiales de la lista</label>
  </div>
  ${A===B?`<div class="banner info">${ICON.clock}<div>${l.length<2?'Los movimientos aparecen cuando haya al menos dos reportes cargados. Con el script diario se llenará solo.':'Elige dos fechas distintas.'}</div></div>`:''}
  <div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><div class="lbl">Aumentos (entradas)</div><div class="val" style="color:var(--good)">${ins.length}</div><div class="foot">material × almacén</div></div>
    <div class="card kpi"><div class="lbl">Disminuciones (salidas)</div><div class="val" style="color:var(--crit)">${outs.length}</div><div class="foot">material × almacén</div></div>
    <div class="card kpi"><div class="lbl">Almacenes con movimiento</div><div class="val">${Object.keys(byWh).length}</div><div class="foot">entre ${fmtShort(A.date)} y ${fmtShort(B.date)}</div></div>
  </div>
  <div class="tbl-wrap"><table><thead><tr><th>Almacén</th><th>Código</th><th>Material</th><th>Und.</th><th class="num">${fmtShort(A.date)}</th><th class="num">${fmtShort(B.date)}</th><th class="num">Movimiento</th></tr></thead>
  <tbody>${moves.map(m=>{const i=info(m.code);return `<tr class="click" data-act="mat:${m.code}:${whType(m.w)==='OTRO'?'GPON':whType(m.w)}"><td><b>${esc(m.w)}</b></td><td class="code">${m.code}</td><td class="wrap"><div class="mname">${esc(i.name)}</div></td><td>${esc(unitEs(i.unit))}</td><td class="num">${fmt(m.a)}</td><td class="num">${fmt(m.b)}</td><td class="num ${m.d>0?'delta-up':'delta-dn'}">${m.d>0?'+':''}${fmt(m.d)}</td></tr>`}).join('') || `<tr><td colspan="7" class="empty">${A===B?'—':'Sin movimientos con estos filtros.'}</td></tr>`}</tbody></table></div>`;
  $('#mA').onchange=e=>{mv.a=e.target.value; render();};
  $('#mB').onchange=e=>{mv.b=e.target.value; render();};
  $('#mT').onchange=e=>{mv.t=e.target.value; render();};
  $('#mR').onchange=e=>{mv.r=e.target.value; render();};
  $('#mC').onchange=e=>{mv.onlyCat=e.target.checked; render();};
}

/* ============ 5. Calendario ============ */
function allWhs(){ const c = curWh(); const s = new Set(whsIn(c)); S.deliveries.forEach(d=>{ if(d.origin) s.add(d.origin); if(d.dest) s.add(d.dest); }); return [...s].sort(whSort); }
function whSelectOpts(list, sel){
  return SEC_KEYS.map(t=>{ const ws = list.filter(w=>whType(w)===t); return ws.length?`<optgroup label="${SECS[t].title}">${ws.map(w=>`<option value="${w}" ${sel===w?'selected':''}>${w} · ${esc(regionLabel(whRegion(w)))}</option>`).join('')}</optgroup>`:''; }).join('')
    + `<optgroup label="Otros">${[...list.filter(w=>whType(w)==='OTRO'), ...(list.includes('BCCS1')?[]:['BCCS1'])].map(w=>`<option value="${w}" ${sel===w?'selected':''}>${w}</option>`).join('')}</optgroup>`;
}
function vCalendario(){
  const c = S.cal, t = todayISO();
  const first = new Date(c.y, c.m, 1);
  const start = new Date(c.y, c.m, 1-((first.getDay()+6)%7));
  const cells = []; for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); cells.push(d); }
  const weeks = cells[35].getMonth()!==c.m ? 5 : 6;
  const filt = d => (!c.wh || d.dest===c.wh || d.origin===c.wh) && (!c.st || (c.st==='vencida'?isOverdue(d):d.status===c.st));
  const byDay = {}; S.deliveries.filter(filt).forEach(d=>(byDay[d.date]=byDay[d.date]||[]).push(d));
  Object.values(byDay).forEach(a=>a.sort((x,y)=>(x.time||'').localeCompare(y.time||'')));
  const od = S.deliveries.filter(isOverdue).sort((a,b)=>a.date.localeCompare(b.date));
  const next = S.deliveries.filter(d=>d.date>=t && d.date<=addDays(t,14) && d.status!=='cancelado' && d.status!=='entregado').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  const monthN = S.deliveries.filter(d=>{const x=parseISO(d.date);return x.getFullYear()===c.y&&x.getMonth()===c.m;}).length;
  const chipLabel = d => { const it=(d.items||[])[0]; return `${d.time?d.time+' ':''}${d.dest?whRegion(d.dest)+' · ':''}${it?info(it.code).name:(TYPES[d.type]||'Entrega')}`; };
  $('#main').innerHTML = header('Calendario de entregas', `Ingresos, transferencias, despachos y devoluciones · ${monthN} en ${MES[c.m]}`, null) + `
  <div class="toolbar">
    <button class="btn" id="cPrev" aria-label="Mes anterior">‹</button>
    <b style="min-width:150px;text-align:center;font-size:16px;text-transform:capitalize">${MES[c.m]} ${c.y}</b>
    <button class="btn" id="cNext" aria-label="Mes siguiente">›</button>
    <button class="btn" id="cToday">Hoy</button>
    <span class="grow"></span>
    <select id="cWh"><option value="">Todos los almacenes</option>${whSelectOpts(allWhs(), c.wh)}</select>
    <select id="cSt"><option value="">Todos los estados</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${c.st===k?'selected':''}>${v.l}</option>`).join('')}<option value="vencida" ${c.st==='vencida'?'selected':''}>Vencida</option></select>
    <button class="btn pri edit-only" id="cNew">+ Nueva entrega</button>
  </div>
  <div class="legend" style="margin-bottom:10px"><span><i style="background:var(--accent)"></i>Programado</span><span><i style="background:var(--warn)"></i>En tránsito</span><span><i style="background:var(--good)"></i>Entregado</span><span><i style="background:var(--crit)"></i>Vencida</span><span><i style="background:var(--ink-3)"></i>Cancelado</span></div>
  <div class="cal-wrap">
    <div class="cal">${DOW.map(d=>`<div class="dh">${d}</div>`).join('')}
      ${cells.slice(0,weeks*7).map(d=>{const iso=isoDate(d);const list=byDay[iso]||[];
        return `<div class="day ${d.getMonth()!==c.m?'out':''} ${iso===t?'today':''}" data-act="day:${iso}">
          <div class="dn"><span>${d.getDate()}</span>${list.length>3?`<span class="muted" style="font-weight:500">${list.length}</span>`:''}</div>
          ${list.slice(0,3).map(x=>`<div class="chip st-${x.status} ${isOverdue(x)?'overdue':''}" data-act="del:${x.id}" data-tip="<div class='tt'>${esc(TYPES[x.type]||'')}</div>${esc([x.origin,x.dest].filter(Boolean).join(' → '))}<br>${esc(chipLabel(x))}<br>${esc((STATUS[x.status]||{}).l||'')}${isOverdue(x)?' · VENCIDA':''}">${esc(chipLabel(x))}</div>`).join('')}
          ${list.length>3?`<div class="more">+${list.length-3} más</div>`:''}</div>`}).join('')}
    </div>
    <div class="grid">
      <div class="card"><h3 style="color:${od.length?'var(--crit)':'inherit'}">Vencidas (${od.length})</h3><p class="hint">Fecha pasada y aún no entregadas.</p>
        ${od.length?`<div class="list">${od.map(delivLi).join('')}</div>`:'<p class="muted" style="margin:0">Ninguna. ¡Todo al día!</p>'}</div>
      <div class="card"><h3>Próximos 14 días (${next.length})</h3>
        ${next.length?`<div class="list">${next.map(delivLi).join('')}</div>`:'<p class="muted" style="margin:0">Sin entregas programadas.</p>'}</div>
    </div>
  </div>`;
  $('#cPrev').onclick=()=>{ if(--c.m<0){c.m=11;c.y--;} render(); };
  $('#cNext').onclick=()=>{ if(++c.m>11){c.m=0;c.y++;} render(); };
  $('#cToday').onclick=()=>{ const d=new Date(); c.y=d.getFullYear(); c.m=d.getMonth(); render(); };
  $('#cWh').onchange=e=>{c.wh=e.target.value; render();};
  $('#cSt').onchange=e=>{c.st=e.target.value; render();};
  $('#cNew').onclick=()=>openDelivery(null,{});
}

function openDelivery(id, preset){
  const d = id ? S.deliveries.find(x=>x.id===id) : null;
  const v = Object.assign({date:todayISO(), time:'', type:'ingreso', origin:'', dest:'', party:'', doc:'', resp:'', status:'programado', notes:'', items:[{code:'',qty:''}]}, d||{}, preset||{});
  if(!v.items || !v.items.length) v.items=[{code:'',qty:''}];
  const c = curWh();
  const whs = allWhs();
  const whSel = (name,val,ph) => `<select name="${name}"><option value="">${ph}</option>${whSelectOpts(whs, val)}</select>`;
  const known = new Map(); [...catGpon(), ...catBccs()].forEach(i=>{ if(i.code) known.set(i.code, i.name); }); S.cortes.forEach(x=>Object.entries(x.names).forEach(([k,n])=>{ if(!known.has(k)) known.set(k, n[0]); }));
  const matOpts = [...known].map(([k,n])=>`<option value="${esc(k)}">${esc(k)} — ${esc(n)}</option>`).join('');
  const itemRow = it => `<tr><td style="width:46%"><input list="matlist" name="icode" value="${esc(it.code)}" placeholder="Código de material"><div class="muted iname" style="font-size:11.5px"></div></td>
      <td style="width:22%"><input type="number" min="0" step="any" name="iqty" value="${esc(it.qty)}" placeholder="Cantidad"><div class="warnline iwarn"></div></td>
      <td class="muted iunit" style="width:12%;font-size:12px"></td><td><button type="button" class="btn ghost sm edit-only" data-rm>${ICON.x}</button></td></tr>`;
  openModal(`<form id="dForm"><div class="mh"><div><h3>${!S.canWrite?'Detalle de entrega':d?'Editar entrega':'Nueva entrega'}</h3>${d?`<div class="muted" style="font-size:12px">Registrada ${d.createdAt?fmtDate(d.createdAt.slice(0,10)):''}${d.createdBy?' por '+esc(d.createdBy):''}</div>`:''}</div><button type="button" class="btn ghost" data-act="close">${ICON.x}</button></div>
    <div class="form">
      <label>Fecha<input type="date" name="date" value="${esc(v.date)}" required></label>
      <label>Hora (opcional)<input type="time" name="time" value="${esc(v.time)}"></label>
      <label>Tipo<select name="type">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${v.type===k?'selected':''}>${l}</option>`).join('')}</select></label>
      <label>Estado<select name="status">${Object.entries(STATUS).map(([k,s])=>`<option value="${k}" ${v.status===k?'selected':''}>${s.l}</option>`).join('')}</select></label>
      <label>Almacén origen${whSel('origin',v.origin,'— Externo / proveedor —')}</label>
      <label>Almacén destino${whSel('dest',v.dest,'— Externo / contrata / obra —')}</label>
      <label>Proveedor / contrata / obra<input type="text" name="party" value="${esc(v.party)}" placeholder="Ej. ZTE, contrata, proyecto…"></label>
      <label>N° guía / OC / pedido<input type="text" name="doc" value="${esc(v.doc)}" placeholder="Ej. GR-000123"></label>
      <label class="full">Responsable<input type="text" name="resp" value="${esc(v.resp)}" placeholder="Nombre de quien recibe o despacha"></label>
      <div class="full"><div style="font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px">Materiales</div>
        <table class="items-tbl"><tbody id="itBody">${v.items.map(itemRow).join('')}</tbody></table>
        <button type="button" class="btn sm edit-only" id="addIt">+ Agregar material</button>
        <datalist id="matlist">${matOpts}</datalist></div>
      <label class="full">Notas<textarea name="notes" rows="2">${esc(v.notes)}</textarea></label>
    </div>
    <div class="mfoot"><div>${d?`<button type="button" class="btn danger edit-only" id="dDel">Eliminar</button>`:''}</div>
      <div class="row"><button type="button" class="btn" data-act="close">${S.canWrite?'Cancelar':'Cerrar'}</button><button type="submit" class="btn pri edit-only" id="dSave">${d?'Guardar cambios':'Registrar entrega'}</button></div></div>
  </form>`);
  const form = $('#dForm'), body = $('#itBody');

function readFile(f){
  if(!window.XLSX){ S.pending={error:'El lector de Excel aún no terminó de cargar. Intenta de nuevo en unos segundos.'}; renderPreview(); return; }

  r.onload = () => { try{ S.pending = parseWorkbook(XLSX.read(new Uint8Array(r.result), {type:'array'}), f.name); } catch(err){ S.pending = {error: err.message || String(err)}; } renderPreview(); };
  r.readAsArrayBuffer(f);
}
const sheetRows = (wb, name) => XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:'', raw:true});
function findDate(rows){
  for(const r of rows.slice(0,15)) for(const c of r){ const s=String(c); const m = s.match(/(\d{2})[\/-](\d{2})[\/-](\d{4})/); if(m && /date|fecha|ngày|report/i.test(s)) return `${m[3]}-${m[2]}-${m[1]}`; }
  return null;
}
const numv = v => { if(v===''||v===null||v===undefined) return 0; const n = typeof v==='number' ? v : Number(String(v).replace(/,/g,'')); return isNaN(n) ? 0 : n; };
function parseCatalogSheet(rows){
  const h = rows.findIndex(r=>r.some(c=>String(c).trim().toLowerCase()==='wh_code'));
  if(h<0) return null;
  const hdr = rows[h].map(c=>String(c).trim().toLowerCase());
  const ci = hdr.indexOf('wh_code'), si = hdr.indexOf('section'), mi = hdr.indexOf('material'), ti = hdr.indexOf('type'), ui = hdr.indexOf('unit');
  let grp = ''; const items = [];
  for(const r of rows.slice(h+1)){
    const first = String(r[0]??'').trim(), mat = String(r[mi]??'').trim();
    if(/^[A-Z]$/.test(first) && mat && !String(r[ci]??'').trim()){ grp = mat.replace(/\s*section\s*$/i,''); continue; }
    if(!mat) continue;
    items.push({code:normCode(r[ci]), sub:String(r[si]??'').trim(), name:mat, type:String(r[ti]??'').trim(), unit:String(r[ui]??'').trim(), grp});
  }
  return items;
}
function parseWorkbook(wb, fileName){
  // 1) Lista de materiales
  const catNames = wb.SheetNames.filter(n=>/^(gpon|bccs1)$/i.test(n.trim()));
  if(catNames.length){
    const out = {};
    for(const n of catNames){ const items = parseCatalogSheet(sheetRows(wb,n)); if(items) out[n.trim().toLowerCase()] = items; }
    if(Object.keys(out).length) return {kind:'catalog', catalog:out, fileName};
  }
  const rows = sheetRows(wb, wb.SheetNames[0]);
  const date = findDate(rows);
  const names = {}, whNames = {}, out = [];
  const add = (w, code, name, unit, g, b) => { if(!names[code]) names[code] = [cleanName(name), String(unit||'').trim()]; out.push([w, code, g, b]); };
  // 2) Inventory Report (una fila por almacén y material)
  let h = rows.findIndex(r=>r.some(c=>/^warehouse code$/i.test(String(c).trim())));
  if(h>=0){
    const hdr = rows[h].map(c=>String(c).trim());
    const wi = hdr.findIndex(c=>/^warehouse code$/i.test(c));
    const wn = hdr.findIndex((c,i)=>i!==wi && /^ware.?v?house$/i.test(c));
    const pi = hdr.findIndex(c=>/product name/i.test(c)), ci = hdr.findIndex(c=>/^code$/i.test(c)), ui = hdr.findIndex(c=>/^unit$/i.test(c)), qi = hdr.findIndex(c=>/quantity/i.test(c));
    const sub = (rows[h+1]||[]).map(c=>String(c).trim().toLowerCase());
    const gi = sub.indexOf('good')>=0 ? sub.indexOf('good') : qi, bi = sub.indexOf('broken');
    for(const r of rows.slice(h+1)){
      const w = String(r[wi]??'').trim(), code = normCode(r[ci]);
      if(!/^[A-Z0-9]+(_[A-Z0-9]+)+$/i.test(w) || !/^\d+$/.test(code)) continue;
      if(wn>=0 && r[wn]) whNames[w] = String(r[wn]).trim();
      add(w.toUpperCase(), code, r[pi], r[ui], numv(r[gi]), bi>=0 ? numv(r[bi]) : 0);
    }
    if(!out.length) throw new Error('El reporte no tiene filas de materiales.');
    return {kind:'wh', date:date||todayISO(), dateFound:!!date, rows:out, names, whNames, fileName};
  }
  // 3) General report on remainders (formato anterior: una columna por almacén)
  h = rows.findIndex(r=>r.some(c=>/code of materials/i.test(String(c))));
  if(h>=0){
    const hdr = rows[h].map(c=>String(c).trim());
    const ci = hdr.findIndex(c=>/code of materials/i.test(c)), ni = hdr.findIndex(c=>/name of materials/i.test(c)), ui = hdr.findIndex(c=>/^unit/i.test(c)), ti = hdr.findIndex(c=>/total/i.test(c));
    const whc = []; for(let k=ti+1;k<hdr.length;k++) if(hdr[k]) whc.push([k,hdr[k]]);
    for(const r of rows.slice(h+1)){ const code = normCode(r[ci]); if(!code) continue; whc.forEach(([k,w])=>{ const v=numv(r[k]); if(v) add(w, code, r[ni], r[ui], v, 0); }); if(!names[code]) names[code]=[cleanName(r[ni]), String(r[ui]||'').trim()]; }
    return {kind:'wh', date:date||todayISO(), dateFound:!!date, rows:out, names, whNames, fileName};
  }
  // 4) Reporte BCCS1
  h = rows.findIndex(r=>r.some(c=>/c[oó]digo de producto/i.test(String(c))));
  if(h>=0){
    const hdr = rows[h].map(c=>String(c).trim());
    const ci = hdr.findIndex(c=>/c[oó]digo de producto/i.test(c)), ni = hdr.findIndex(c=>/nombre de producto/i.test(c)), ui = hdr.findIndex(c=>/^unidad$/i.test(c));
    const ti = hdr.findIndex(c=>/^total/i.test(c)), si = hdr.findIndex(c=>/situaci/i.test(c)), wi = hdr.findIndex(c=>/wh code/i.test(c));
    for(const r of rows.slice(h+1)){
      const code = normCode(r[ci]); if(!/^\d+$/.test(code)) continue;
      const v = numv(r[ti]); const ok = si<0 || /new|nuevo|good/i.test(String(r[si]));
      add('BCCS1', code, r[ni], r[ui], ok?v:0, ok?0:v);
    }
    return {kind:'bccs1', date:date||todayISO(), dateFound:!!date, rows:out, names, whNames, fileName};
  }
  throw new Error('No reconozco este archivo. Debe ser el Inventory Report del WMS, el reporte de BCCS1 o la lista de materiales (hojas GPON / BCCS1).');
}

      ${last?`<div class="muted" style="font-size:12px;margin-top:6px">Reporte anterior: ${fmtDate(last.date)}</div>`:''}
      ${exists?`<div class="banner warn mt" style="margin-bottom:0">${ICON.warn}<div>Ya existe un reporte del ${fmtDate(p.date)}; se reemplazará.</div></div>`:''}
      <div class="row mt"><button class="btn pri" id="pSave">Guardar reporte</button><button class="btn" id="pCancel">Descartar</button></div></div>`;
    $('#pDate').onchange=e=>{p.date=e.target.value; renderPreview();};

  $('#pSave').onclick=async()=>{

    if(ok){ toast(p.kind==='catalog'?'Lista de materiales guardada':`Reporte del ${fmtDate(p.date)} guardado`); const k=p.kind; S.pending=null; if(k==='wh'){ S.sel=null; location.hash='#proyectos'; } else if(k==='bccs1'){ S.selLm=null; location.hash='#lastmile'; } render(); }
    else $('#pSave').disabled=false;

  else if(k==='del'){ e.stopPropagation(); openDelivery(x); }
  else if(k==='day'){ if(S.canWrite) openDelivery(null,{date:x}); }
  else if(k==='xfer'){ openDelivery(null,{type:'transferencia', origin:x, dest:y, items:[{code:z,qty:''}], date:addDays(todayISO(),1)}); }
  else if(k==='delcorte'){ if(!a.dataset.c){ a.dataset.c=1; a.textContent='¿Confirmar?'; return; } if(await removeCorte(x)){ toast('Reporte eliminado'); render(); } }
});

/* ============ Persistencia (Supabase) ============ */
const APP = window.APP_CONFIG || {};
let sb = null;
function setConn(state, msg){
  S.conn = state;
  const color = {ok:'var(--good)', connecting:'var(--warn)', off:'var(--crit)', demo:'var(--warn)'}[state];
  $('#syncState').innerHTML = `<span class="dot" style="background:${color}"></span>${esc(msg)}`;
}
function writeErr(e){
  console.error(e);
  const m = (e && (e.message||e.error_description)) || '';
  if(/row-level security|permission|not authorized|JWT|401|403/i.test(m)) toast('Tu cuenta no tiene permiso para modificar datos.');
  else toast('No se pudo guardar. ' + m);
  return false;
}
async function run(p){ const {data, error} = await p; if(error) throw error; return data; }
const rowToCorte = r => { const d = r.data||{}; return {id:r.id, kind:r.kind, date:String(r.date).slice(0,10), rows:(d.rows||[]).map(x=>({w:x[0], c:x[1], g:+x[2]||0, b:+x[3]||0})), names:d.names||{}, whNames:d.whNames||{}, fileName:r.file_name||'', uploadedAt:r.uploaded_at||'', uploadedBy:r.uploaded_by||''}; };
const rowToDel = r => ({id:String(r.id), date:r.date, time:r.time||'', type:r.type||'ingreso', status:r.status||'programado', origin:r.origin||'', dest:r.dest||'',
  party:r.party||'', doc:r.doc||'', resp:r.resp||'', notes:r.notes||'', items:r.items||[], createdAt:r.created_at||'', createdBy:r.created_by_email||'', updatedAt:r.updated_at||''});
const delToRow = d => ({date:d.date, time:d.time||null, type:d.type, status:d.status, origin:d.origin||null, dest:d.dest||null, party:d.party||null,
  doc:d.doc||null, resp:d.resp||null, notes:d.notes||null, items:d.items, updated_at:new Date().toISOString(), updated_by_email:S.email||null});

async function loadCortes(){
  const rows = await run(sb.from('cortes').select('*').order('date',{ascending:false}).limit(200));
  S.cortes = rows.map(rowToCorte);
  if(S.sel && !cortesOf('wh').some(c=>c.date===S.sel)) S.sel = null;
  if(S.selLm && !cortesOf('bccs1').some(c=>c.date===S.selLm)) S.selLm = null;
}
async function loadCatalog(){
  const rows = await run(sb.from('catalogo').select('*'));
  S.catalog = {gpon:DEFAULT_CATALOG.gpon, bccs1:DEFAULT_CATALOG.bccs1}; S.catalogFromDb = false;
  S.lm = {stock:{}, upd:{}, rate:{}, kit:{}};
  for(const r of rows){
    if(r.id==='lm_branch'){ const v = r.items && !Array.isArray(r.items) ? r.items : {}; S.lm = {stock:v.stock||{}, upd:v.upd||{}, rate:v.rate||{}, kit:v.kit||{}}; continue; }
    if(Array.isArray(r.items) && r.items.length){ S.catalog[r.id] = r.items; S.catalogFromDb = true; }
  }
}
async function loadDels(){ S.deliveries = (await run(sb.from('deliveries').select('*'))).map(rowToDel).filter(d=>d.date); }
async function loadCfg(){
  const r = await run(sb.from('settings').select('*').eq('id',1).maybeSingle());
  S.cfg = {min:(r&&r.min)||{}, wh:(r&&r.wh)||{}};
}
async function loadSync(){
  const {data, error} = await sb.from('sync_log').select('*').order('finished_at',{ascending:false}).limit(60);
  if(error){ S.syncMissing = true; S.sync = []; return; }
  S.syncMissing = false; S.sync = data || [];
}
const LOADERS = {cortes:loadCortes, catalogo:loadCatalog, deliveries:loadDels, settings:loadCfg, sync_log:loadSync};
let reloadT = {};
function reload(which){
  clearTimeout(reloadT[which]);
  reloadT[which] = setTimeout(async ()=>{
    try{ await LOADERS[which](); setConn('ok','Datos al día'); scheduleRender(); }
    catch(e){ console.error(e); setConn('off','Error al actualizar datos'); }
  }, 300);
}

const local = { dels:new Map() }; // modo demo sin Supabase
async function saveCorte(rec){
  const row = {...rec, uploaded_at:new Date().toISOString(), uploaded_by:S.email||'web'};
  if(!sb){ S.cortes = S.cortes.filter(c=>c.id!==rec.id).concat([rowToCorte(row)]); return true; }
  try{ await run(sb.from('cortes').upsert(row)); await loadCortes(); return true; }catch(e){ return writeErr(e); }
}
async function removeCorte(id){
  if(!sb){ S.cortes = S.cortes.filter(c=>c.id!==id); return true; }
  try{ await run(sb.from('cortes').delete().eq('id',id)); await loadCortes(); return true; }catch(e){ return writeErr(e); }
}
async function saveCatalog(cat){
  if(!sb){ Object.assign(S.catalog, cat); S.catalogFromDb = true; return true; }
  try{ await run(sb.from('catalogo').upsert(Object.entries(cat).map(([id,items])=>({id, items, updated_at:new Date().toISOString(), updated_by:S.email||null})))); await loadCatalog(); return true; }
  catch(e){ return writeErr(e); }
}
async function saveLm(v){
  if(!sb){ S.lm = v; return true; }
  try{ await run(sb.from('catalogo').upsert({id:'lm_branch', items:v, updated_at:new Date().toISOString(), updated_by:S.email||null})); await loadCatalog(); return true; }
  catch(e){ return writeErr(e); }
}
async function saveDelivery(id, rec){
  if(!sb){ const nid=id||('d'+Date.now()); local.dels.set(nid,{...rec,id:nid,createdAt:rec.createdAt||new Date().toISOString(),createdBy:rec.createdBy||'demo'}); S.deliveries=[...local.dels.values()]; return true; }
  try{
    if(id) await run(sb.from('deliveries').update(delToRow(rec)).eq('id',id));
    else await run(sb.from('deliveries').insert({...delToRow(rec), created_by_email:S.email||null}));
    await loadDels(); return true;
  }catch(e){ return writeErr(e); }
}
async function removeDelivery(id){
  if(!sb){ local.dels.delete(id); S.deliveries=[...local.dels.values()]; return true; }
  try{ await run(sb.from('deliveries').delete().eq('id',id)); await loadDels(); return true; }catch(e){ return writeErr(e); }
}
let cfgBusy = Promise.resolve();
function saveCfg(patch){
  const next = {...S.cfg, ...patch};
  const go = async () => {
    if(!sb){ S.cfg=next; render(); return true; }
    try{ await run(sb.from('settings').upsert({id:1, min:next.min||{}, wh:next.wh||{}, updated_at:new Date().toISOString()})); S.cfg=next; render(); return true; }
    catch(e){ return writeErr(e); }
  };
  cfgBusy = cfgBusy.then(go, go); return cfgBusy;
}

/* ============ Acceso del equipo ============ */
function renderAuth(){
  const box = $('#authBox'); if(!box) return;
  if(!sb){ box.innerHTML = ''; return; }
  box.innerHTML = S.email
    ? `<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(S.email)}">Equipo: <b style="color:var(--ink)">${esc(S.email)}</b></div><button class="btn sm" data-act="logout">Cerrar sesión</button>`
    : `<button class="btn sm" data-act="login">Acceso equipo</button>`;
}
function applySession(session){
  S.email = session?.user?.email || null;
  S.canWrite = !!session;
  document.body.classList.toggle('ro', !S.canWrite);
  renderAuth();
}
function openLogin(){
  if(!sb){ toast('Configura Supabase en config.js para activar el acceso.'); return; }
  openModal(`<form id="lForm" style="max-width:380px;margin:0 auto"><div class="mh"><div><h3>Acceso equipo FBB</h3><div class="muted" style="font-size:12.5px">Para registrar entregas, cargar reportes y fijar mínimos.</div></div><button type="button" class="btn ghost" data-act="close">${ICON.x}</button></div>
    <div class="form" style="grid-template-columns:1fr"><label>Correo<input type="email" name="email" required autocomplete="username"></label>
    <label>Contraseña<input type="password" name="pass" required autocomplete="current-password"></label><div class="warnline" id="lErr"></div></div>
    <div class="mfoot"><span></span><button type="submit" class="btn pri" id="lBtn">Ingresar</button></div></form>`);
  const f = $('#lForm');
  f.onsubmit = async e => {
    e.preventDefault(); $('#lBtn').disabled = true; $('#lErr').textContent='';
    const {error} = await sb.auth.signInWithPassword({email:f.email.value.trim(), password:f.pass.value});
    if(error){ $('#lErr').textContent = 'Correo o contraseña incorrectos.'; $('#lBtn').disabled=false; return; }
    closeModal(); toast('Sesión iniciada');
  };
}

let rT = null;
function scheduleRender(){ cancelAnimationFrame(rT); rT = requestAnimationFrame(()=>{ if(!$('#scrim').classList.contains('on') && !(S.lmEdit && S.view==='lastmile')) render(); else renderNav(); }); }

async function init(){
  route();
  const configured = APP.SUPABASE_URL && APP.SUPABASE_ANON_KEY && !/TU-PROYECTO|PEGA_AQUI/.test(APP.SUPABASE_URL + APP.SUPABASE_ANON_KEY);
  if(!configured || !window.supabase){
    S.canWrite = true; document.body.classList.remove('ro');
    setConn('demo', window.supabase ? 'Modo demo: configura config.js' : 'Sin conexión a la base de datos');
    S.conn = 'off'; render(); return;
  }
  sb = window.supabase.createClient(APP.SUPABASE_URL, APP.SUPABASE_ANON_KEY);
  setConn('connecting','Conectando…');
  const {data} = await sb.auth.getSession();
  applySession(data.session);
  sb.auth.onAuthStateChange((_e, session)=>{ applySession(session); render(); });
  loadSync().then(()=>scheduleRender()).catch(()=>{});
  const results = await Promise.allSettled([loadCortes(), loadCatalog(), loadDels(), loadCfg()]);
  const failed = results.map((r,i)=>r.status==='rejected'?[['cortes','catalogo','deliveries','settings'][i], r.reason]:null).filter(Boolean);
  if(failed.length){
    failed.forEach(([t,e])=>console.error('Error cargando', t, e));
    const msg = failed.map(([t,e])=>`${t}: ${(e&&e.message)||e}`).join(' | ');
    setConn('off','No se pudo cargar: ' + failed.map(f=>f[0]).join(', '));
    S.loadError = msg; S.conn = 'off';
  } else { setConn('ok','Datos al día'); S.conn = 'ok'; }
  render();
  const ch = sb.channel('cambios');
  Object.keys(LOADERS).forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>reload(t)));
  ch.subscribe();
  setInterval(()=>{ if(document.visibilityState==='visible') Object.keys(LOADERS).forEach(reload); }, 5*60*1000);
}
init();
</script>
